<svg xmlns="http://www.w3.org/2000/svg" width="900" height="330" viewBox="0 0 900 330" role="img" aria-label="Dynamic GitHub profile metrics">
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#020617"/>
      <stop offset="55%" stop-color="#082f49"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" x2="1">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="100%" stop-color="#a78bfa"/>
    </linearGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="4" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="900" height="330" rx="18" fill="url(#bg)"/>
  <circle cx="760" cy="76" r="42" fill="none" stroke="#22d3ee" stroke-width="2" opacity=".45" filter="url(#glow)">
    <animate attributeName="r" values="34;52;34" dur="5s" repeatCount="indefinite"/>
  </circle>
  <text x="52" y="48" fill="#f8fafc" font-size="24" font-family="Arial" font-weight="700">GitHub Signal</text>
  <text x="52" y="72" fill="#93c5fd" font-size="13" font-family="Arial">Rendered from live repository metadata on 2026-09-07</text>
  <text x="52" y="106" fill="#dbeafe" font-size="14" font-family="Arial">Python</text>
  <rect x="160" y="88" width="320" height="18" rx="9" fill="url(#bar)">
    <animate attributeName="width" from="24" to="320" dur="0.8s" fill="freeze" />
  </rect>
  <text x="494" y="102" fill="#93c5fd" font-size="12" font-family="Arial">5</text>
<text x="52" y="144" fill="#dbeafe" font-size="14" font-family="Arial">JavaScript</text>
  <rect x="160" y="126" width="256" height="18" rx="9" fill="url(#bar)">
    <animate attributeName="width" from="24" to="256" dur="0.92s" fill="freeze" />
  </rect>
  <text x="430" y="140" fill="#93c5fd" font-size="12" font-family="Arial">4</text>
<text x="52" y="182" fill="#dbeafe" font-size="14" font-family="Arial">TypeScript</text>
  <rect x="160" y="164" width="128" height="18" rx="9" fill="url(#bar)">
    <animate attributeName="width" from="24" to="128" dur="1.04s" fill="freeze" />
  </rect>
  <text x="302" y="178" fill="#93c5fd" font-size="12" font-family="Arial">2</text>
<text x="52" y="220" fill="#dbeafe" font-size="14" font-family="Arial">HTML</text>
  <rect x="160" y="202" width="128" height="18" rx="9" fill="url(#bar)">
    <animate attributeName="width" from="24" to="128" dur="1.1600000000000001s" fill="freeze" />
  </rect>
  <text x="302" y="216" fill="#93c5fd" font-size="12" font-family="Arial">2</text>
  <text x="560" y="136" fill="#f8fafc" font-size="42" font-family="Arial" font-weight="700">15</text>
  <text x="560" y="160" fill="#93c5fd" font-size="13" font-family="Arial">tracked repos</text>
  <text x="690" y="136" fill="#f8fafc" font-size="42" font-family="Arial" font-weight="700">5</text>
  <text x="690" y="160" fill="#93c5fd" font-size="13" font-family="Arial">recent updates</text>
  <text x="560" y="224" fill="#f8fafc" font-size="42" font-family="Arial" font-weight="700">0</text>
  <text x="560" y="248" fill="#93c5fd" font-size="13" font-family="Arial">stars</text>
  <text x="690" y="224" fill="#f8fafc" font-size="42" font-family="Arial" font-weight="700">0</text>
  <text x="690" y="248" fill="#93c5fd" font-size="13" font-family="Arial">forks</text>
</svg>
